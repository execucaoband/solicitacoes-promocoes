ACTIONS['tk-preview'] = async (el) => {
  const t = tkFind(el); if (!t) return; const old = el.textContent; el.disabled = true; el.textContent = 'Abrindo…';
  let d; try { d = await ticketDraft(t); } catch (e) { toast('Não foi possível abrir a solicitação: ' + e.message, 'err'); el.disabled = false; el.textContent = old; return; }
  el.disabled = false; el.textContent = old;
  const { s, plan } = computePreview(d); Object.assign(PV, { t, s, plan, fi: 0, sheet: 'promo' });
  const errs = [...new Set(s.errors.map((e) => `${e.where}: ${e.msg}`))]; const warns = [...new Set(s.warnings.map((e) => `${e.where}: ${e.msg}`))];
  const a = `data-id="${esc(t.id)}" data-uid="${esc(t.uid || '')}"`; const r = t.resumo || {};
  openModal({ title: 'Prévia do Excel', wide: true,
    body: `<div class="pv-head"><div><b>${esc(t.solicitante || '—')}</b> · ${ticketChip(t)}<div class="small muted">Último envio ${fmtDateTime(t.enviadoEm)} · ${plural(s.cvs.length, 'cliente')} · ${plural(s.ivs.length, 'produto')} · ${plan ? plural(plan.files.length, 'arquivo') : 'sem arquivo'}</div></div></div>
      ${errs.length ? `<div class="alert err"><b>${errs.length} pendência(s): o Excel só pode ser baixado depois de resolver</b> (linhas em vermelho; passe o mouse para ver o motivo).<ul>${errs.slice(0, 8).map((m) => `<li>${esc(m)}</li>`).join('')}</ul>${errs.length > 8 ? `<span class="small">e mais ${errs.length - 8}.</span>` : ''}</div>` : '<div class="alert ok">Sem pendências: pronto para baixar.</div>'}
      ${warns.length ? `<details class="box"><summary>${warns.length} aviso(s)</summary><div><ul>${warns.slice(0, 20).map((m) => `<li class="small">${esc(m)}</li>`).join('')}</ul></div></details>` : ''}
      ${d.meta && d.meta.observacoes ? `<p class="small"><b>Observações do solicitante:</b> ${esc(d.meta.observacoes)}</p>` : ''}
      <div id="pv-tabs"></div><div id="pv-table"></div>`,
    footer: `<button class="btn" data-act="modal-close">Fechar</button>${!['devolvido', 'atendido'].includes(t.status) ? `<button class="btn" data-act="tk-return" ${a}>Devolver</button>` : ''}<button class="btn" data-act="tk-open" ${a}>Editar</button><button class="btn primary" data-act="tk-excel" ${a} ${errs.length ? 'disabled title="Resolva as pendências para baixar"' : ''}>Baixar Excel</button>` });
  renderPreviewTabs(); renderPreviewTable();
};

/* ===================== Condições logo ao adicionar o produto (popup) =====================
   Ao clicar no "+" de um produto, abre uma janela para preço e vigência; ao salvar, volta para a lista de produtos. */
const QC = { ultimaVig: null, fila: [], total: 0 };
/** Outros sabores da mesma marca, tamanho e tipo (mesmo cartão de preço) que ainda não estão na solicitação. */
function outrosSabores(p) {
  const k = priceGroupKey(p); const ja = new Set(S.draft.items.map((i) => i.productKey));
  return S.bases.produtos.records.filter((x) => x.key !== p.key && !ja.has(x.key) && priceGroupKey(x) === k && compatClients(x).length).sort((a, b) => String(a.descricao).localeCompare(b.descricao));
}
function qcField(id, label, input, hint = '') { return `<div class="field qc-f" id="qcw-${id}"><label for="qc-${id}">${label}</label>${input}<div class="qc-msg" id="qcm-${id}">${hint}</div></div>`; }
function openQuickCond(itemId) {
  const it = S.draft.items.find((i) => i.id === itemId); if (!it) return;
  const p = IDX.produtos.get(it.productKey) || it.snap; const unit = p.tipo === 'Caixa' ? 'por caixa' : 'por unidade';
  if (!it.inicio && !it.fim && QC.ultimaVig) { it.inicio = QC.ultimaVig.inicio; it.fim = QC.ultimaVig.fim; }
  const lock = investManual() && reembBloqueado(p); const g = reembDoProduto(p);
  const reembHintTxt = !investManual() ? '' : lock ? `🔒 Tabela: ${esc(reembRotulo(g))}${p.tipo === 'Caixa' ? ` = ${fmtBRL(toCents(g.reembolso))} × ${qtdCaixaDe(p)} un.` : ''}` : g ? `Tabela: ${fmtBRL(reembCents(p) || 0)} (${esc(reembRotulo(g))})` : 'Sem valor na tabela de investimentos: informe.';
  const sib = QC.fila.length || QC.total ? [] : outrosSabores(p); const marca = `${normSpaces(p.marca) || 'mesma marca'} · ${embalagemEfetiva(p)} · ${p.tipo || ''}`;
  const sibHtml = sib.length ? `<div class="qc-sib"><label class="check qc-sib-all"><input type="checkbox" id="qc-sib-on"><span><b>Adicionar também os outros ${plural(sib.length, 'sabor', 'sabores')}</b> de ${esc(marca)}</span></label>
      <div class="qc-sib-body" id="qc-sib-body" hidden>
        <div class="qc-sib-list">${sib.map((x) => `<label class="check"><input type="checkbox" class="qc-sib-item" value="${esc(x.key)}" checked><span>${esc(x.descricao)}${reembBloqueado(x) ? ` <span class="muted small">· reemb. ${fmtBRL(reembCents(x))}</span>` : ''}</span></label>`).join('')}</div>
        <div class="qc-sib-modo"><label class="check"><input type="radio" name="qc-modo" value="mesmo" checked><span><b>Mesmo preço e vigência</b> para todos os sabores</span></label>
          <label class="check"><input type="radio" name="qc-modo" value="um"><span><b>Preço por sabor:</b> abre um por vez, já preenchido com estes valores</span></label></div>
        <p class="small muted">O reembolso de cada sabor segue a tabela de investimentos.</p></div></div>` : '';
  const passo = QC.total ? `<p class="qc-step">Sabor ${QC.total - QC.fila.length} de ${QC.total}</p>` : '';
  const body = `<form id="qc-form" class="qc-form" autocomplete="off">
    ${passo}<div class="qc-prod"><b>${esc(p.descricao)}</b><span class="muted small">${esc(p.ean)} · ${esc(p.tipo || '')} · preço ${unit} · ${plural(it.recipients.length, 'cliente')}</span></div>
    ${sibHtml}
    <div class="qc-grid">
      ${qcField('ttc', 'Preço TTC promocional <span class="req">*</span>', `<input type="text" inputmode="decimal" id="qc-ttc" value="${esc(it.ttc)}" placeholder="R$ 0,00">`)}
      ${investManual() ? qcField('reembolso', 'Reembolso <span class="req">*</span>', `<input type="text" inputmode="decimal" id="qc-reembolso" value="${esc(it.reembolso || '')}" placeholder="R$ 0,00"${lock ? ' readonly class="reemb-lock"' : ''}>`, `<span class="hint">${reembHintTxt}</span>`) : ''}
      ${qcField('inicio', 'Início da vigência <span class="req">*</span>', `<input type="date" id="qc-inicio" value="${esc(it.inicio)}">`)}
      ${qcField('fim', 'Fim da vigência <span class="req">*</span>', `<input type="date" id="qc-fim" value="${esc(it.fim)}" min="${esc(it.inicio)}">`, '<span class="hint" id="qc-dias"></span>')}
    </div>
    ${QC.ultimaVig && it.inicio === QC.ultimaVig.inicio && it.fim === QC.ultimaVig.fim ? '<p class="small muted qc-note">Vigência copiada do último produto. Altere se precisar.</p>' : ''}
    <details class="qc-more"><summary>Limite por cupom e cadeado</summary><div class="qc-grid">
      ${investManual() ? qcField('limite', 'Limite por cupom', `<input type="text" inputmode="numeric" id="qc-limite" value="${esc(it.limite || '')}">`) : ''}
      ${qcField('cadeado', 'Cadeado', `<input type="text" id="qc-cadeado" value="${esc(it.cadeado || '')}" placeholder="Opcional">`)}</div></details>
    <button type="submit" hidden></button></form>`;
  const footer = `<button class="btn danger ghost-danger" id="qc-remove">Remover produto</button><span class="grow"></span><button class="btn" id="qc-later">${QC.fila.length ? 'Pular este sabor' : 'Preencher depois'}</button><button class="btn primary" id="qc-ok">${QC.fila.length ? 'Salvar e ir para o próximo sabor' : 'Salvar e escolher outro produto'}</button>`;
  openModal({ title: 'Preço e vigência', body, footer, onClose: () => { qcWrite(it); QC.fila = []; QC.total = 0; qcBack(it, false); } });
  const dias = () => { if (!$('#qc-dias')) return; const n = daysInclusive($('#qc-inicio').value, $('#qc-fim').value); $('#qc-dias').textContent = n && n > 0 ? plural(n, 'dia') : ''; $('#qc-fim').min = $('#qc-inicio').value || ''; };
  const limpa = (f) => { const m = $('#qcm-' + f), w = $('#qcw-' + f); if (m && m.dataset.orig != null) m.innerHTML = m.dataset.orig; if (w) w.classList.remove('has-err'); };
  for (const f of ['ttc', 'reembolso', 'inicio', 'fim']) { const el = $('#qc-' + f); if (el) el.addEventListener('input', () => { limpa(f); if (f === 'inicio' || f === 'fim') { limpa('inicio'); limpa('fim'); } dias(); }); }
  dias();
  const save = (e) => {
    if (e) e.preventDefault(); qcWrite(it); touchDraft();
    const iv = st().ivs.find((x) => x.item.id === it.id); const errs = iv ? iv.fieldErr : {};
    let first = null;
    for (const f of ['ttc', 'reembolso', 'inicio', 'fim']) {
      const m = $('#qcm-' + f); const w = $('#qcw-' + f); if (!m) continue;
      if (m.dataset.orig == null) m.dataset.orig = m.innerHTML;
      if (errs[f]) { m.innerHTML = `<span class="msg err">${esc(errs[f])}</span>`; w.classList.add('has-err'); first = first || f; }
      else { w.classList.remove('has-err'); m.innerHTML = m.dataset.orig; }
    }
    if (!errs.fim) dias();
    if (first) { const el = $('#qc-' + first); if (el) el.focus(); return; }
    QC.ultimaVig = { inicio: it.inicio, fim: it.fim };
    const on = $('#qc-sib-on'); const keys = on && on.checked ? Array.from(document.querySelectorAll('.qc-sib-item:checked')).map((c) => c.value) : [];
    const um = keys.length && $('input[name="qc-modo"]:checked').value === 'um';
    closeModal(true);
    if (keys.length) {
      const novos = qcCriarSabores(it, keys); touchDraft();
      if (um) { QC.total = novos.length + 1; QC.fila = novos.map((x) => x.id); qcRefresh(); toast(`${plural(novos.length, 'sabor adicionado', 'sabores adicionados')}. Ajuste o preço de cada um.`, 'ok'); openQuickCond(QC.fila.shift()); return; }
      qcRefresh(); const sv = st(); const ruins = novos.filter((x) => { const iv = sv.ivs.find((v) => v.item.id === x.id); return iv && Object.keys(iv.fieldErr).length; });
      toast(`${plural(novos.length + 1, 'sabor salvo', 'sabores salvos')} com R$ ${it.ttc} · ${fmtDate(it.inicio)} a ${fmtDate(it.fim)}.${ruins.length ? ` ${plural(ruins.length, 'sabor precisa', 'sabores precisam')} de ajuste na etapa 3.` : ' Escolha o próximo produto.'}`, ruins.length ? 'warn' : 'ok');
      qcFocusSearch(); return;
    }
    qcNext(it, true);
  };
  $('#qc-form').onsubmit = save; $('#qc-ok').onclick = save;
  $('#qc-later').onclick = () => { if (QC.fila.length || QC.total) { qcWrite(it); closeModal(true); qcNext(it, false); } else closeModal(); };
  $('#qc-remove').onclick = () => { S.draft.items = S.draft.items.filter((x) => x.id !== it.id); touchDraft(); closeModal(true); toast(`Removido: ${p.descricao}`); if (QC.fila.length) { qcRefresh(); openQuickCond(QC.fila.shift()); return; } QC.total = 0; qcRefresh(); qcFocusSearch(); };
  const on = $('#qc-sib-on'); if (on) on.onchange = () => { $('#qc-sib-body').hidden = !on.checked; const b = $('#qc-ok'); const um = $('input[name="qc-modo"]:checked').value === 'um'; b.textContent = on.checked ? (um ? 'Salvar e ir para o próximo sabor' : 'Salvar todos os sabores') : 'Salvar e escolher outro produto'; };
  document.querySelectorAll('input[name="qc-modo"]').forEach((r) => { r.onchange = () => on && on.onchange(); });
  setTimeout(() => { const f = $('#qc-ttc'); if (f) f.focus(); }, 30);
}
/** Cria os itens dos outros sabores escolhidos, copiando preço, vigência, limite e cadeado do item base. */
function qcCriarSabores(base, keys) {
  const criados = [];
  for (const k of keys) {
    const x = IDX.produtos.get(k); if (!x) continue; const cc = compatClients(x).map((c) => c.key); if (!cc.length) continue;
    const it = newItem(x, cc); for (const f of ['ttc', 'inicio', 'fim', 'limite', 'cadeado']) it[f] = base[f];
    if (investManual() && !reembBloqueado(x) && !reembCents(x)) it.reembolso = reembBloqueado(IDX.produtos.get(base.productKey) || base.snap) ? '' : base.reembolso;
    S.draft.items.push(it); criados.push(it);
  }
  return criados;
}
function qcWrite(it) {
  const v = (id) => { const el = $('#qc-' + id); return el ? el.value : null; };
  for (const f of ['ttc', 'inicio', 'fim', 'limite', 'cadeado']) { const x = v(f); if (x != null) it[f] = f === 'cadeado' || f === 'ttc' || f === 'limite' ? x.trim() : x; }
  const r = $('#qc-reembolso'); if (r && !r.readOnly) { it.reembolso = r.value.trim(); if (typeof marcarReembAdmin === 'function') marcarReembAdmin(it); }
}
function qcRefresh() { if (S.draft.step !== 2) { renderFill(); return; } const c = $('#catalog'); if (c) c.innerHTML = renderCatalog(); const l = $('#items-card'); if (l) l.innerHTML = renderItemsList(); refreshStepper(); }
function qcFocusSearch() { setTimeout(() => { const q = $('#pf-q'); if (q) { q.focus(); q.select && q.select(); } }, 50); }
function qcBack(it, ok) {
  touchDraft(); qcRefresh();
  const p = IDX.produtos.get(it.productKey) || it.snap;
  if (ok) toast(`${p.descricao}: ${it.ttc ? 'R$ ' + it.ttc : ''} · ${fmtDate(it.inicio)} a ${fmtDate(it.fim)}. Escolha o próximo produto.`, 'ok');
  else toast(`${p.descricao} adicionado. Complete preço e vigência depois na etapa 3.`, 'warn');
  qcFocusSearch();
}
/** Depois de salvar/pular: abre o próximo sabor da fila ou volta para a lista de produtos. */
function qcNext(it, ok) {
  if (QC.fila.length) { touchDraft(); qcRefresh(); openQuickCond(QC.fila.shift()); return; }
  const eraFila = QC.total; QC.total = 0;
  if (eraFila) { touchDraft(); qcRefresh(); toast(ok ? 'Sabores preenchidos. Escolha o próximo produto.' : 'Sabores adicionados. Complete os que faltam na etapa 3.', ok ? 'ok' : 'warn'); qcFocusSearch(); return; }
  qcBack(it, ok);
}

init().catch((e) => { console.error(e); if (window.__diagShow) window.__diagShow(String(e && e.message || e)); });
</script>
<script>window.__fimIndex = true;</script>
