<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro de Promoções</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --border:#d9dee7; --border-strong:#b8c0cc;
  --text:#1b2330; --muted:#5b6575; --primary:#1f4fbf; --primary-600:#173e98; --primary-50:#eaf0fd;
  --ok:#1d7a46; --ok-50:#e7f5ec; --warn:#8a5a00; --warn-50:#fff4dc; --err:#b42318; --err-50:#fdecea;
  --lock:#eef1f5; --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --on-accent:#fff; --text-2:#3a4250; --line:#edf0f4; --line-2:#e4e8ee; --head:#f1f4f8; --group:#eef3fd; --hover:#f2f5f9; --row-hover:#fafcff; --row-err:#fff7f6; --row-warn:#fffcf3;
  --err-border:#f2b8b1; --warn-border:#f0d08a; --info-border:#c5d5fa; --ok-border:#b8e0c6; --warn-strong:#d49a00; --focus:#7aa2ff; --flash:#ffcf57;
  --err-text:#7a1810; --warn-text:#5c3d00; --ok-text:#14532d; --topbar:#0f2a5c; --topbar-fg:#dbe5ff; --topbar-line:#6c86c4; --topbar-chip:#2b4a8a;
  --demo-bg:#ffb020; --demo-fg:#2d1b00; --band-low:#2e9d5b; --band-mid:#e0a100; --band-high:#d63c2f; --toast:#1b2330; --toast-err:#8f1d14; --toast-ok:#14532d; --toast-warn:#7a5200;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161f; --surface:#1a212c; --surface-2:#1f2733; --border:#323c4b; --border-strong:#465264; --text:#e6eaf0; --muted:#9aa5b5; --text-2:#c3cad5;
  --primary:#4c7ae8; --primary-600:#a9c0ff; --primary-50:#1f2c4a; --ok:#5fcf8f; --ok-50:#16301f; --warn:#f0c060; --warn-50:#33290f; --err:#ff8a7e; --err-50:#3a1b18; --lock:#252d39;
  --on-accent:#fff; --line:#262f3c; --line-2:#2c3644; --head:#222a36; --group:#1e2a42; --hover:#242c38; --row-hover:#1f2733; --row-err:#2a1b1c; --row-warn:#2a2416;
  --err-border:#6b3029; --warn-border:#6b5520; --info-border:#334a7a; --ok-border:#2c5a3c; --warn-strong:#c9971e; --focus:#7ea2ff; --flash:#c9971e;
  --err-text:#ffb4ab; --warn-text:#f5d48c; --ok-text:#a6e8bf; --topbar:#0b1830; --topbar-fg:#c9d6f5; --topbar-line:#4a5f8f; --topbar-chip:#22396b;
  --demo-bg:#e6a01c; --demo-fg:#241500; --toast:#2d3644; --toast-err:#7d1f17; --toast-ok:#1c5a36; --toast-warn:#6b4a08; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161f; --surface:#1a212c; --surface-2:#1f2733; --border:#323c4b; --border-strong:#465264; --text:#e6eaf0; --muted:#9aa5b5; --text-2:#c3cad5;
  --primary:#4c7ae8; --primary-600:#a9c0ff; --primary-50:#1f2c4a; --ok:#5fcf8f; --ok-50:#16301f; --warn:#f0c060; --warn-50:#33290f; --err:#ff8a7e; --err-50:#3a1b18; --lock:#252d39;
  --on-accent:#fff; --line:#262f3c; --line-2:#2c3644; --head:#222a36; --group:#1e2a42; --hover:#242c38; --row-hover:#1f2733; --row-err:#2a1b1c; --row-warn:#2a2416;
  --err-border:#6b3029; --warn-border:#6b5520; --info-border:#334a7a; --ok-border:#2c5a3c; --warn-strong:#c9971e; --focus:#7ea2ff; --flash:#c9971e;
  --err-text:#ffb4ab; --warn-text:#f5d48c; --ok-text:#a6e8bf; --topbar:#0b1830; --topbar-fg:#c9d6f5; --topbar-line:#4a5f8f; --topbar-chip:#22396b;
  --demo-bg:#e6a01c; --demo-fg:#241500; --toast:#2d3644; --toast-err:#7d1f17; --toast-ok:#1c5a36; --toast-warn:#6b4a08; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font:14px/1.45 var(--font);color:var(--text);background:var(--bg)}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:8px;z-index:100}.skip:focus{left:8px}

/* topo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--topbar);color:var(--on-accent);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;margin-right:8px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.8}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;color:var(--topbar-fg);padding:7px 12px;border-radius:6px;cursor:pointer}
.nav button[aria-current="page"]{background:var(--on-accent);color:var(--topbar);font-weight:600}
.nav button:hover:not([aria-current="page"]){border-color:var(--topbar-line)}
.topbar .spacer{flex:1}
.save-ind{font-size:12px;opacity:.9}
.env-badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--topbar-chip)}
.env-badge.demo{background:var(--demo-bg);color:var(--demo-fg);font-weight:700}
.demo-banner{background:var(--warn-50);border-bottom:1px solid var(--warn-border);color:var(--warn-text);padding:8px 20px;font-size:13px}

main{max-width:1320px;margin:0 auto;padding:18px 20px 80px}
h1,h2,h3{margin:0 0 10px;line-height:1.25} h1{font-size:20px} h2{font-size:17px} h3{font-size:15px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1 1 220px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}

/* formulários */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;background:var(--surface);min-height:36px;width:100%}
textarea{min-height:90px;resize:vertical}
input[readonly],input:disabled,select:disabled{background:var(--lock);color:var(--text-2);cursor:not-allowed}
.locked{position:relative}
.locked::after{content:"🔒";position:absolute;right:8px;top:30px;font-size:12px;opacity:.6}
.field.has-err input,.field.has-err select{border-color:var(--err);background:var(--row-err)}
.field.has-warn input{border-color:var(--warn-strong)}
.msg{font-size:12px;margin-top:2px}
.msg.err{color:var(--err)} .msg.warn{color:var(--warn)} .msg.ok{color:var(--ok)}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:3px;width:16px;height:16px}
fieldset{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:0 0 10px}
legend{font-weight:600;padding:0 4px}

/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:6px;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-accent)}
.btn.primary:hover{background:var(--primary-600)}
.btn.danger{color:var(--err);border-color:var(--err-border)}
.btn.danger:hover{background:var(--err-50)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{padding:3px 8px;min-height:28px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* chips / status */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--ok-50);color:var(--ok);border-color:var(--ok-border)}
.chip.aviso{background:var(--warn-50);color:var(--warn);border-color:var(--warn-border)}
.chip.erro{background:var(--err-50);color:var(--err);border-color:var(--err-border)}
.chip.info{background:var(--primary-50);color:var(--primary);border-color:var(--info-border)}
.chip.neutral{background:var(--lock);color:var(--text-2)}
.band-baixa{color:var(--ok)} .band-media{color:var(--warn)} .band-alta{color:var(--err)}
.band-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.band-dot.baixa{background:var(--band-low)}.band-dot.media{background:var(--band-mid)}.band-dot.alta{background:var(--band-high)}
.alert{border-radius:6px;padding:10px 12px;margin:8px 0;border:1px solid}
.alert.err{background:var(--err-50);border-color:var(--err-border);color:var(--err-text)}
.alert.warn{background:var(--warn-50);border-color:var(--warn-border);color:var(--warn-text)}
.alert.info{background:var(--primary-50);border-color:var(--info-border);color:var(--primary-600)}
.alert.ok{background:var(--ok-50);border-color:var(--ok-border);color:var(--ok-text)}
.alert ul{margin:4px 0 0 18px;padding:0}

/* stepper */
.stepper{display:flex;gap:6px;list-style:none;margin:0 0 6px;padding:0;flex-wrap:wrap}
.stepper li{flex:1 1 150px}
.stepper button{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.stepper .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-weight:700;flex:none}
.stepper button[aria-current="step"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-50)}
.stepper button[aria-current="step"] .num{background:var(--primary);color:var(--on-accent)}
.stepper .done .num{background:var(--ok);color:var(--on-accent)}
.stepper .st{font-size:12px;color:var(--muted);display:block}
.progress{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress>div{height:100%;background:var(--primary);transition:width .25s}
.step-footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;display:flex;justify-content:space-between;gap:10px;z-index:5}

/* abas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;border-bottom:none;background:transparent;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--border);color:var(--text);font-weight:600;margin-bottom:-1px}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}
.side-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:70px;align-self:start}
.side-nav button{text-align:left;border:1px solid transparent;background:transparent;padding:9px 12px;border-radius:6px;cursor:pointer}
.side-nav button[aria-current="page"]{background:var(--surface);border-color:var(--border);font-weight:600;color:var(--primary)}
@media (max-width:860px){.admin-layout{grid-template-columns:1fr}.side-nav{position:static;flex-direction:row;flex-wrap:wrap}}

/* tabelas */
.table-wrap{overflow:auto;max-height:460px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.table-wrap.tall{max-height:640px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t thead th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
table.t tbody tr:hover td{background:var(--row-hover)}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t td.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;white-space:nowrap}
table.t tr.group-row td{background:var(--group);font-weight:600}
table.t tr.row-err td{background:var(--row-err)} table.t tr.row-warn td{background:var(--row-warn)}
.empty{padding:18px;text-align:center;color:var(--muted)}

/* itens (condições) */
.item{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
.item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item>summary::-webkit-details-marker{display:none}
.item>summary .caret{transition:transform .2s;display:inline-block}
.item[open]>summary .caret{transform:rotate(90deg)}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.item.focus-flash{box-shadow:0 0 0 3px var(--focus)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin:12px 0;font-size:13px}
.kv div span{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
.days{font-weight:600;padding:8px 10px;background:var(--primary-50);border-radius:6px;color:var(--primary-600);white-space:nowrap;align-self:flex-end;min-height:36px;display:flex;align-items:center}
.inv-table td{font-size:12.5px}
.recips{display:flex;flex-wrap:wrap;gap:4px}
.field-flash{animation:flash 1.5s}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--flash)}100%{box-shadow:none}}

/* modal e toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:10px;max-width:880px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mbody{padding:16px 18px;max-height:70vh;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:420px;pointer-events:none}
.toast{background:var(--toast);color:var(--on-accent);padding:9px 8px 9px 14px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:13px;display:flex;align-items:flex-start;gap:8px;pointer-events:auto;animation:toast-in .18s ease-out}
.toast-x{border:0;background:transparent;color:inherit;opacity:.75;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;flex:none}
.toast-x:hover{opacity:1;background:rgba(255,255,255,.15)}
@keyframes toast-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.toast.err{background:var(--toast-err)}.toast.ok{background:var(--toast-ok)}.toast.warn{background:var(--toast-warn)}
.suggest{border:1px solid var(--border);border-radius:6px;max-height:240px;overflow:auto;background:var(--surface);margin-top:4px}
.suggest button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:7px 10px;cursor:pointer}
.suggest button:hover,.suggest button:focus{background:var(--primary-50)}
.stat{display:inline-flex;flex-direction:column;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:110px}
.stat b{font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
details.box{border:1px solid var(--border);border-radius:6px;margin:6px 0;background:var(--surface)}
details.box>summary{padding:8px 10px;cursor:pointer;font-weight:600}
details.box>div{padding:0 10px 10px}
code{background:var(--lock);padding:1px 4px;border-radius:4px}
.help h2{margin-top:18px}
.help li{margin-bottom:4px}
@media print{.topbar,.step-footer,.side-nav{display:none}}
.admin-layout>*{min-width:0} main>section{min-width:0}

.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--err);color:var(--on-accent);font-size:11px;font-weight:700;line-height:18px;text-align:center;margin-left:4px}
.share-badge{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--topbar-line);color:var(--topbar-fg)}

.btn.send{background:var(--err);border-color:var(--err);color:var(--on-accent);font-weight:700;padding:9px 18px}
.btn.send:hover{filter:brightness(.92)}
.btn.send:disabled{filter:none}

.sent-pop{text-align:center;padding:8px 0}
.sent-check{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:28px;font-weight:700;background:var(--ok-50);color:var(--ok);border:2px solid var(--ok-border)}

.btn.add-one{border-color:var(--primary);color:var(--primary);font-weight:600;background:var(--primary-50);padding:0 7px;min-height:22px;font-size:11px;border-radius:5px}
.btn.add-one:hover{background:var(--primary);color:var(--on-accent)}
.user-badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--topbar-chip);color:var(--topbar-fg)}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--primary-50);border-color:var(--info-border)}

label.sel-all{display:inline-flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;white-space:nowrap}
label.sel-all input{width:15px;height:15px;margin:0}
table.t tr.row-sel td{background:var(--primary-50)}
.cond-top{padding-bottom:12px}
.bulk-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px}
.bulk-strip .field input{min-height:32px;padding:4px 8px}
.pgroup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px 6px;margin-bottom:10px}
.pg-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pg-title{display:flex;flex-direction:column;min-width:0;flex:1}
.pg-title b{font-size:14.5px}
.pg-status{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.st-dot.ok{background:var(--ok)}.st-dot.aviso{background:var(--warn-strong)}.st-dot.erro{background:var(--err)}
.st-txt{color:var(--muted)}.st-txt.ok{color:var(--ok)}.st-txt.aviso{color:var(--warn)}.st-txt.erro{color:var(--err)}
.icon-btn{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;flex:none}
.icon-btn:hover{background:var(--err-50);color:var(--err)}
.pg-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px}
.pg-fields label{font-size:12px;font-weight:600;color:var(--muted)}
.pg-fields .req{color:var(--err)}
.pg-fields input{min-height:34px}
.pg-msg{min-height:16px;font-size:11.5px;line-height:16px}
.pg-msg .msg{margin:0;font-size:11.5px}
.pg-items{border-top:1px solid var(--line);margin-top:2px}
.pg-items>summary{cursor:pointer;color:var(--primary);font-size:12.5px;padding:7px 0;list-style:none}
.pg-items>summary::-webkit-details-marker{display:none}
.pg-items>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.pg-items[open]>summary::before{transform:rotate(90deg)}
.pg-items .item{box-shadow:none;margin-bottom:6px;border-color:var(--line-2)}
.pg-items .item>summary{padding:7px 10px;font-size:13px}
.pg-fields .field:has(.msg.err) input{border-color:var(--err)}
.pg-fields{align-items:start}
.pg-fields .field{min-width:0}
.pg-fields label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;height:18px}
.pg-fields input,.bulk-strip input{height:36px;min-height:36px;padding-top:0;padding-bottom:0;line-height:34px}

/* Diagnóstico: mostra "Carregando" e qualquer erro na própria tela (útil quando o console não está à mão). */
(function () {
  var f = document.getElementById('view-fill'); if (f) f.innerHTML = '<div class="card" style="margin:20px"><p>Carregando o aplicativo…</p></div>';
  function show(msg) {
    if (window.__appReady) return;
    var m = document.getElementById('main'); if (!m) return;
    var d = document.getElementById('diag-erro'); if (!d) { d = document.createElement('div'); d.id = 'diag-erro'; d.className = 'alert err'; d.style.margin = '20px 0'; m.insertBefore(d, m.firstChild); }
    d.innerHTML = '<b>Falha ao iniciar.</b><br>' + String(msg).replace(/[<>&]/g, '') + '<br><span class="small">Se você colou os arquivos no Apps Script, confira se o Index foi colado inteiro (a última linha deve ser: FIM DO ARQUIVO Index).</span>';
  }
  window.__diagShow = show;
  window.addEventListener('error', function (e) { show((e.message || 'erro') + (e.lineno ? ' (linha ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
  setTimeout(function () { if (window.__appReady || document.getElementById('auth')) return;
    var d = !window.__jsStart ? 'o código do aplicativo não foi executado' : !window.__fimIndex ? 'o arquivo Index parece incompleto' : 'parou na etapa: ' + (window.__stage || 'início');
    show('O aplicativo está demorando mais de 45 segundos para carregar (' + d + '). Se continuar assim, atualize a página.'); }, 45000);
})();
</script>

/* ===================== Armazenamento local (IndexedDB) ===================== */
const DB = {
  db: null, mem: new Map(), fallback: false,
  async open() {
    if (this.db || this.fallback) return;
    try {
      this.db = await new Promise((res, rej) => {
        setTimeout(() => rej(new Error('IndexedDB não respondeu')), 4000); // alguns navegadores/iframes travam a abertura
        const rq = indexedDB.open('clubePromocoesDB', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); rq.onblocked = () => rej(new Error('IndexedDB bloqueado'));
      });
    } catch (e) { console.warn('IndexedDB indisponível; usando memória', e); this.fallback = true; }
  },
  async get(key) {
    await this.open(); if (this.fallback) return clone(this.mem.get(key));
    return new Promise((res, rej) => { const rq = this.db.transaction('kv').objectStore('kv').get(key); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
  },
  async set(key, val) {
    await this.open(); if (this.fallback) { this.mem.set(key, clone(val)); return; }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  async del(key) {
    await this.open(); if (this.fallback) { this.mem.delete(key); return; }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },

/** Sugere a linha de cabeçalho (1-based). */
function suggestHeaderRow(type, sheetName, rows) {

    if (score > bestScore) { bestScore = score; best = r + 1; }

      for (const [k, L] of Object.entries(def.original.map)) map[k] = colIndex(L);
      // campos adicionais por cabeçalho (código, qtd/caixa) quando existirem
      autoFill(def, heads, map, ['codigo', 'qtdCaixa']);

  for (const pass of ['exact', 'contains']) {
    for (const f of def.fields) {
      if (!keys.includes(f.k) || map[f.k] >= 0) continue;
      for (const s of f.syn) {
        const idx = heads.findIndex((h, i) => h && !used.has(i) && (pass === 'exact' ? h === s : (s.length > 3 && (` ${h} `).includes(` ${s} `))));

  el.innerHTML = `<div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title"><div class="auth-brand">Cadastro de Promoções</div>${html}<div class="auth-ver">Versão ${esc(APP_BUILD)}</div></div>`; el.hidden = false; return el;
}
function closeAuth() { const el = $('#auth'); if (el) el.remove(); }
function showLogin(msg) {
  return new Promise((resolve) => {
    authScreen(`<h1 id="auth-title">Entrar</h1><form id="login-form" novalidate>
      <div class="field"><label for="lg-user">Usuário</label><input type="text" id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="lg-pass">Senha</label><input type="password" id="lg-pass" autocomplete="current-password" required></div>
      <div class="msg err" id="lg-msg" role="alert">${esc(msg || '')}</div>
      <button class="btn primary auth-btn" type="submit" id="lg-ok">Entrar</button>
      <p class="small muted">Não tem acesso ou esqueceu a senha? Fale com a Administração.</p></form>`);
    $('#lg-user').focus();
    $('#login-form').onsubmit = async (e) => {
      e.preventDefault(); const user = $('#lg-user').value.trim(), pass = $('#lg-pass').value; const b = $('#lg-ok');
      if (!user || !pass) { $('#lg-msg').textContent = 'Informe usuário e senha.'; return; }
      b.disabled = true; b.textContent = 'Entrando…'; $('#lg-msg').textContent = '';
      try { const r = await gas('apiLogin', user, pass); applyUser(r.token, r.user); if (r.user.trocarSenha) await showChangePassword(true, pass); closeAuth(); resolve(); }
      catch (err) { $('#lg-msg').textContent = err.message; b.disabled = false; b.textContent = 'Entrar'; $('#lg-pass').select(); }
    };
  });
}
function showChangePassword(obrigatoria, atualConhecida) {
  return new Promise((resolve) => {
    authScreen(`<h1 id="auth-title">${obrigatoria ? 'Crie sua senha' : 'Trocar senha'}</h1>${obrigatoria ? '<p class="small muted">Primeiro acesso ou senha redefinida: escolha uma senha nova (mínimo 8 caracteres, com letras e números).</p>' : ''}
      <form id="pw-form" novalidate>
      ${atualConhecida ? '' : '<div class="field"><label for="pw-old">Senha atual</label><input type="password" id="pw-old" autocomplete="current-password"></div>'}
      <div class="field"><label for="pw-new">Senha nova</label><input type="password" id="pw-new" autocomplete="new-password"></div>
      <div class="field"><label for="pw-new2">Repita a senha nova</label><input type="password" id="pw-new2" autocomplete="new-password"></div>
      <div class="msg err" id="pw-msg" role="alert"></div>
      <div class="btn-row">${obrigatoria ? '' : '<button class="btn" type="button" id="pw-cancel">Cancelar</button>'}<button class="btn primary auth-btn" type="submit" id="pw-ok">Salvar senha</button></div></form>`);
    ($('#pw-old') || $('#pw-new')).focus();
    if ($('#pw-cancel')) $('#pw-cancel').onclick = () => { closeAuth(); resolve(false); };
    $('#pw-form').onsubmit = async (e) => {
      e.preventDefault(); const old = atualConhecida || ($('#pw-old') ? $('#pw-old').value : ''); const n1 = $('#pw-new').value, n2 = $('#pw-new2').value;
      if (n1 !== n2) { $('#pw-msg').textContent = 'As duas senhas novas não são iguais.'; return; }
      const b = $('#pw-ok'); b.disabled = true;
      try { await gas('apiTrocarSenha', SH.token, old, n1); if (SH.me) SH.me.trocarSenha = false; if (!obrigatoria) { closeAuth(); toast('Senha alterada.', 'ok'); } resolve(true); }
      catch (err) { $('#pw-msg').textContent = err.message; b.disabled = false; }
    };
  });
}
function mountUserMenu() {
  if ($('#user-menu')) return; const ub = $('#user-badge'); if (!ub) return;
  const m = document.createElement('span'); m.id = 'user-menu'; m.className = 'user-menu';
  m.innerHTML = '<button class="btn sm ghost-top" data-act="pw-change">Trocar senha</button><button class="btn sm ghost-top" data-act="logout">Sair</button>';
  ub.after(m);
}
function registerAuthActions() {
  ACTIONS['gh-generate'] = () => generateGithubHtml();
  ACTIONS['pw-change'] = () => showChangePassword(false);
  ACTIONS.logout = async () => { try { await gas('apiLogout', SH.token); } catch (e) { /* já expirada */ } tokenStore.set(null); location.reload(); };
}

/** Primeira abertura no GitHub sem o endereço do servidor: pede o link /exec uma vez. */
function askApiUrl() {
  return new Promise((resolve) => {
    authScreen(`<h1 id="auth-title">Configurar servidor</h1><p class="small muted">Cole o link do aplicativo no Google Apps Script (Implantar → Gerenciar implantações → URL do app da Web, termina em <b>/exec</b>). Isso é feito uma vez; depois, ao gerar o index.html em Administração → Bases, o link vai gravado no arquivo.</p>
      <form id="api-form" novalidate><div class="field"><label for="api-url">Link do servidor</label><input type="text" id="api-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
      <div class="msg err" id="api-msg" role="alert"></div><button class="btn primary auth-btn" type="submit">Salvar</button></form>`);
    $('#api-url').focus();
    $('#api-form').onsubmit = (e) => { e.preventDefault(); const u = $('#api-url').value.trim(); if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { $('#api-msg').textContent = 'O link deve começar com https://script.google.com/ e terminar em /exec.'; return; } try { localStorage.setItem('promo:api', u); } catch (err) { window.APP_API = u; } resolve(); };

async function initShared() {
  if (window.APP_MODE === 'github' && !transport()) await askApiUrl();
  if (!transport()) return; // arquivo aberto fora do Apps Script/GitHub: modo local
  SH.github = transport() === 'http';
  SH.inViewer = true; registerAuthActions();
  const tok = tokenStore.get();
  if (tok) {
    try { const me = await gas('apiMe', tok); applyUser(tok, me); if (me.trocarSenha) await showChangePassword(true); closeAuth(); }
    catch (e) {
      if (e.code === 'offline') { authScreen('<h1 id="auth-title">Sem conexão</h1><p>Não foi possível falar com o servidor. Verifique a internet e tente de novo.</p><button class="btn primary auth-btn" onclick="location.reload()">Tentar de novo</button>'); await new Promise(() => {}); }
      tokenStore.set(null);
    }

  if (!SH.token) await showLogin();

/* ---------- bases e configuração ---------- */
async function loadSharedBase(t, meta) {
  if (!meta || !meta.tag) return emptyBase(t);
  const cache = await DB.get('shared-cache:base:' + t).catch(() => null);
  if (cache && cache.tag === meta.tag) return cache.base;
  let s = ''; for (let i = 0; i < meta.partes; i++) s += await gas('apiBasePart', SH.token, t, meta.tag, i);
  const base = JSON.parse(s); DB.set('shared-cache:base:' + t, { tag: meta.tag, base }).catch(() => {});
  return base;
}
/** Bases gravadas no projeto (Dados.html): texto base64 comprimido, baixado uma vez e guardado no navegador. */
async function embeddedBases() {
  if (embeddedBases.v !== undefined) return embeddedBases.v;
  embeddedBases.v = null;
  const z = await gas('apiBasesEmbutidas', SH.token); if (!z) return null;
  const key = 'embedded-bases:' + z.length + ':' + z.slice(0, 40) + z.slice(-40);
  const cached = await DB.get(key).catch(() => null); if (cached) return (embeddedBases.v = cached);
  const bin = Uint8Array.from(atob(z), (c) => c.charCodeAt(0));
  const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  embeddedBases.v = basesFromSnapshot(JSON.parse(txt)); embeddedBases.v.geradoEm = JSON.parse(txt).geradoEm;
  DB.set(key, embeddedBases.v).catch(() => {});
  return embeddedBases.v;
}
/* ---------- bases criptografadas dentro do HTML (GitHub) ---------- */
function bytesToB64(u) { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

async function dataKey() { if (!dataKey.k) dataKey.k = await crypto.subtle.importKey('raw', b64ToBytes(await gas('apiChaveDados', SH.token)), 'AES-GCM', false, ['encrypt', 'decrypt']); return dataKey.k; }
async function encryptSnapshot(obj) {
  const z = await streamBytes(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('deflate-raw'));
  const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await dataKey(), z));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12); return bytesToB64(all);
}
async function decryptSnapshot(b64) {
  const all = b64ToBytes(b64); const z = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.subarray(0, 12) }, await dataKey(), all.subarray(12)));
  return JSON.parse(new TextDecoder().decode(await streamBytes(z, new DecompressionStream('deflate-raw'))));
}
function htmlDataBlock() { const el = document.getElementById('dados-cripto'); return el ? el.textContent.replace(/\s+/g, '') : ''; }
async function htmlBases() {
  const b = htmlDataBlock(); if (!b) return null;
  let snap; try { snap = await decryptSnapshot(b); } catch (e) { throw new Error('Não foi possível abrir as bases deste arquivo (chave do servidor diferente da usada para gerar o index.html).'); }
  const out = basesFromSnapshot(snap); if (snap.investimentos) out.investimentos = snap.investimentos; out.geradoEm = snap.geradoEm; return out;
}
function snapshotFromBases() {
  const cols = ['key', 'codigo', 'fantasia', 'segmento', 'cnpj', 'supervisor', 'gerencia', 'kaCodigo', 'keyAccount']; const c = S.bases.clientes;
  const meta = (b) => ({ versao: b.meta.versao, arquivo: b.meta.arquivo, dataAtualizacao: b.meta.dataAtualizacao, aba: b.meta.aba, linhaCabecalho: b.meta.linhaCabecalho, mapeamento: b.meta.mapeamento, opcoes: b.meta.opcoes });
  return { v: 2, geradoEm: Date.now(), clientes: { meta: meta(c), cols, rows: c.records.map((r) => cols.map((k) => (r[k] == null ? '' : r[k]))) },
    produtos: { meta: meta(S.bases.produtos), records: S.bases.produtos.records.map((r) => { const o = { ...r }; delete o._row; return o; }) },
    investimentos: S.bases.investimentos.records.length ? { type: 'investimentos', records: S.bases.investimentos.records, meta: { ...S.bases.investimentos.meta, ultimoRelatorio: null, historico: [] } } : null };
}
async function generateGithubHtml() {
  if (!SH.admin) return;
  let src; try { const r = await fetch(location.href.split('#')[0], { cache: 'no-store' }); if (!r.ok) throw new Error(); src = await r.text(); }
  catch (e) { toast('Para gerar o arquivo, abra o aplicativo pelo endereço do GitHub (não pelo arquivo no computador).', 'err'); return; }
  if (!/id="dados-cripto"/.test(src)) { toast('Este arquivo não tem o espaço das bases (use o index.html da versão GitHub).', 'err'); return; }
  toast('Gerando o arquivo com as bases criptografadas…');
  const enc = await encryptSnapshot(snapshotFromBases()); const wrapped = enc.replace(/(.{1000})/g, '$1\n');
  src = src.replace(/(<script type="text\/plain" id="dados-cripto">)[\s\S]*?(<\/script>)/, () => `<script type="text/plain" id="dados-cripto">\n${wrapped}\n<\/script>`);
  src = src.replace(/window\.APP_API = '[^']*';/, () => `window.APP_API = '${apiUrl().replace(/'/g, '')}';`);
  downloadBlob(new Blob([src], { type: 'text/html;charset=utf-8' }), 'index.html');
  SH.pendentesGithub = new Set(); safeRender();
  toast('index.html gerado. Envie este arquivo para o GitHub (substituindo o atual).', 'ok');
}
/** Base importada no Google Drive mais nova que a gravada no index.html? (o tag guarda a hora do envio) */
function tagTime(tag) { const n = tag ? parseInt(String(tag).slice(1), 36) : 0; return isFinite(n) ? n : 0; }
function driveNewer(m, d) { return !!(m && m.tag && tagTime(m.tag) > ((d && d.geradoEm) || 0)); }
async function loadSharedAll() {
  const b = await gas('apiBootstrap', SH.token); SH.planilhaUrl = b.planilhaUrl || ''; SH.basesMeta = b.bases; SH.basesOrigem = {};
  if (SH.github) {
    let d = await htmlBases(); let origem = 'html';
    if (!d) { d = await embeddedBases(); origem = 'embutida'; }
    for (const t of ['clientes', 'produtos', 'investimentos']) {
      const m = b.bases[t];
      if (driveNewer(m, d)) { S.bases[t] = await loadSharedBase(t, m); S.baseTags[t] = m.tag; SH.basesOrigem[t] = 'importada'; continue; }
      S.bases[t] = d && d[t] && d[t].records && d[t].records.length ? d[t] : emptyBase(t); S.baseTags[t] = null; SH.basesOrigem[t] = S.bases[t].records.length ? origem : '';
    }
    SH.basesGeradas = d && d.geradoEm; S.config = b.config ? mergeConfig(b.config) : defaultConfig(); return;
  }
  for (const t of ['clientes', 'produtos', 'investimentos']) {
    const e = t === 'investimentos' ? null : await embeddedBases();
    // base importada no Drive vale, a menos que o arquivo Dados do projeto seja mais novo
    if (b.bases[t] && b.bases[t].tag && driveNewer(b.bases[t], { geradoEm: e && e[t] && e[t].records.length ? e.geradoEm : 0 })) { S.bases[t] = await loadSharedBase(t, b.bases[t]); S.baseTags[t] = b.bases[t].tag; SH.basesOrigem[t] = 'importada'; continue; }
    S.bases[t] = e ? e[t] : emptyBase(t); S.baseTags[t] = null; SH.basesOrigem[t] = e ? 'embutida' : '';

async function saveSharedBase(t) {
  if (!SH.admin) throw new Error('Somente a Administração atualiza as bases.');
  const b = S.bases[t]; const s = JSON.stringify(b); const n = Math.max(1, Math.ceil(s.length / GAS_PART));
  const prog = (i) => { const el = $('#imp-progress'); if (el) el.textContent = `Salvando no Google Drive: parte ${i} de ${n}… não feche a página.`; };
  const up = await gas('apiBaseUploadStart', SH.token, t, n);
  for (let i = 0; i < n; i++) { prog(i + 1); await gas('apiBaseUploadPart', SH.token, up, i, s.slice(i * GAS_PART, (i + 1) * GAS_PART)); }
  const r = await gas('apiBaseUploadCommit', SH.token, up, { versao: b.meta.versao, registros: b.records.length, dataAtualizacao: b.meta.dataAtualizacao });
  S.baseTags[t] = r.tag; SH.basesOrigem = SH.basesOrigem || {}; SH.basesOrigem[t] = 'importada'; if (SH.github) (SH.pendentesGithub = SH.pendentesGithub || new Set()).add(t); DB.set('shared-cache:base:' + t, { tag: r.tag, base: b }).catch(() => {});
}
async function saveSharedConfig() { await gas('apiSalvarConfig', SH.token, JSON.stringify(S.config)); }

/* ---------- sincronização (consulta periódica) ---------- */
function stopSharedSync() { SH.timers.forEach((x) => clearInterval(x)); SH.timers = []; }
function startSharedSync() {
  stopSharedSync(); if (!sharedActive()) return;
  loadTicketCache().then(pollTickets); SH.timers.push(setInterval(pollTickets, SH.admin ? 30000 : 60000)); SH.timers.push(setInterval(pollBases, 300000));
  setTimeout(() => { SH.initialTickets = false; }, 4000);
}
async function pollBases() {
  try {
    const b = await gas('apiBootstrap', SH.token);
    const emb = SH.github ? null : (embeddedBases.v || null);
    for (const t of ['clientes', 'produtos', 'investimentos']) { const m = b.bases[t]; const tag = m ? m.tag : null; if (tag && tag !== S.baseTags[t] && driveNewer(m, { geradoEm: SH.github ? SH.basesGeradas : (emb && t !== 'investimentos' ? emb.geradoEm : 0) })) { S.bases[t] = await loadSharedBase(t, m); S.baseTags[t] = tag; SH.basesOrigem[t] = 'importada'; rebuildIndexes(); invalidate(); toast(`${BASE_DEFS[t].label} atualizada pela Administração.`, 'warn'); safeRender(); } }
    if (b.config) { const next = mergeConfig(b.config); if (JSON.stringify(next) !== JSON.stringify(S.config)) { S.config = next; invalidate(); safeRender(); } }
  } catch (e) { console.warn('Atualização das bases', e); }
}
/* Cópia das solicitações no navegador: aparece na hora ao abrir e continua visível sem internet. */
const CACHE_N = 30;
const ticketCacheKey = () => 'tickets-cache:' + SH.uid;
async function loadTicketCache() {
  const c = await DB.get(ticketCacheKey()).catch(() => null); if (!c || !c.list) return;
  SH.cacheEm = c.em; if (SH.admin) SH.tickets = new Map([['todos', c.list]]); SH.mine = c.list.filter((t) => t.uid === SH.uid); ticketsChanged();
}
async function cachePayload(id, json) {
  const k = 'ticket-payload:' + SH.uid; const c = (await DB.get(k).catch(() => null)) || { ids: [], data: {} };
  c.data[id] = json; c.ids = [id].concat(c.ids.filter((x) => x !== id)); for (const old of c.ids.splice(CACHE_N)) delete c.data[old];
  DB.set(k, c).catch(() => {});
}
async function cachedPayload(id) { const c = await DB.get('ticket-payload:' + SH.uid).catch(() => null); return c && c.data[id]; }
async function pollTickets() {
  let list; try { list = await gas('apiListarSolicitacoes', SH.token); SH.offline = false; } catch (e) { console.warn('Solicitações', e); if (e.code === 'offline' && !SH.offline) { SH.offline = true; ticketsChanged(); } return; }
  SH.cacheEm = Date.now(); DB.set(ticketCacheKey(), { em: SH.cacheEm, list: list.slice().sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0)).slice(0, SH.admin ? 500 : CACHE_N) }).catch(() => {});
  if (SH.admin && !SH.initialTickets) for (const t of list) { const prev = SH.seen.get(t.id); if (t.status === 'novo' && (prev == null || t.versao > prev)) toast('Nova solicitação recebida' + (t.solicitante ? ' de ' + t.solicitante : ''), 'ok'); }
  SH.seen = new Map(list.map((t) => [t.id, t.versao]));
  if (SH.admin) SH.tickets = new Map([['todos', list]]);
  SH.mine = list.filter((t) => t.uid === SH.uid); ticketsChanged();
}
let ticketsRenderPending = false;
function ticketsChanged() {
  updateNavBadges();
  if (ticketsRenderPending) return; ticketsRenderPending = true;
  setTimeout(() => { ticketsRenderPending = false; if (S.view === 'tickets' || (S.view === 'admin' && S.adminTab === 'chamados')) safeRender(); }, 150);
}
function safeRender() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !$('#modal-bg')) { if (!safeRender.pending) { safeRender.pending = true; a.addEventListener('blur', () => { safeRender.pending = false; setTimeout(render, 50); }, { once: true }); } return; }
  if ($('#modal-bg')) return; render();
}

/* ---------- solicitações ---------- */
const TICKET_STATUS = { novo: ['Nova', 'info'], em_edicao: ['Em edição pelo solicitante', 'neutral'], em_analise: ['Em análise', 'aviso'], devolvido: ['Devolvida para correção', 'erro'], atendido: ['Atendida', 'ok'] };
function ticketChip(t) { const [l, c] = TICKET_STATUS[t.status] || [t.status, 'neutral']; return `<span class="chip ${c}">${esc(l)}</span>`; }
function localTickets() { return S.requests.filter((r) => r.status && r.status !== 'arquivado'); }
function queueTime(t) { return t.filaEm || t.criadoEm || t.enviadoEm || t.recebidoEm || 0; }
function ticketsAll() { const l = sharedActive() ? Array.from(SH.tickets.values()).flat() : localTickets(); return l.slice().sort((a, b) => queueTime(a) - queueTime(b)); }
function ticketsMine() { const l = sharedActive() ? SH.mine : localTickets().filter((t) => t.origem === 'Enviado neste navegador'); return l.slice().sort((a, b) => (b.enviadoEm || 0) - (a.enviadoEm || 0)); }
function updateNavBadges() {
  const b = $('#badge-admin'); if (b) { const n = isAdminUI() ? ticketsAll().filter((t) => t.status === 'novo').length : 0; b.textContent = n; b.hidden = !n; }
  const m = $('#badge-mine'); if (m) { const n = ticketsMine().filter((t) => t.status === 'devolvido').length; m.textContent = n; m.hidden = !n; }
}
function ticketResumo(s) { return { clientes: s.cvs.length, redes: new Set(s.cvs.map((c) => c.rec.redeKey)).size, produtos: s.ivs.length, vinculos: s.lines.length, grupos: s.groups.length, erros: s.errors.length, pendInvest: s.errors.filter((e) => e.inv).length, avisos: s.warnings.length }; }
async function ticketDraft(t) {

  catch (e) { const c = await cachedPayload(t.id); if (c && e.code === 'offline') { toast('Sem internet: abrindo a cópia salva neste navegador.', 'warn'); return JSON.parse(c); } throw e; }
}
async function ticketUpdate(t, patch, historicoNota) {
  if (t.shared) { const r = await gas('apiAtualizarSolicitacao', SH.token, t.id, JSON.stringify(patch), historicoNota || ''); Object.assign(t, r); pollTickets(); return; }
  const h = (t.historico || []).concat({ em: Date.now(), status: patch.status || t.status, por: null, nota: historicoNota || '' });
  const r = S.requests.find((x) => x.id === t.id); Object.assign(r, patch, { historico: h, atualizadoEm: Date.now() }); await saveRequests(); Object.assign(t, r);
}
async function ticketSend() {
  const s = st(); const resumo = ticketResumo(s); const now = Date.now(); const link = S.draft.meta.chamado; const d = clone(S.draft);

  const fields = { solicitante: normSpaces(S.draft.meta.solicitante), observacoes: normSpaces(S.draft.meta.observacoes), resumo, basesVersoes: baseVersions() };
  if (sharedActive()) {
    const id = link && link.id ? link.id : uid('ch-'); d.meta.chamado = { id, uid: SH.uid };
    const body = JSON.stringify(d); const t = await gas('apiEnviarSolicitacao', SH.token, JSON.stringify({ id, ...fields }), body); cachePayload(t.id, body);

  }
  const id = link && link.id ? link.id : uid('ch-'); let r = S.requests.find((x) => x.id === id); d.meta.chamado = { id, uid: null };

/* =============== ETAPA 1 — CLIENTES =============== */
/* Seleção somente pelo Cód. Cliente (um ou vários). Depois de consultar, o comercial informa o nome da rede:
   esse nome vai para BASE (Promoções) e REDE (CNPJs) e é o relacionamento entre as duas abas.
   PV = Cód. Cliente; Tipo vem do Segmento; o perfil de produtos é escolhido aqui. */
function draftRedes() { const m = new Map(); for (const c of S.draft.clients) { const r = normSpaces(c.rede); if (r && !m.has(keyOf(r))) m.set(keyOf(r), r); } return Array.from(m.values()); }

    <div class="stats"><div class="stat"><b>${s.cvs.length}</b><span>clientes</span></div><div class="stat"><b>${redes.size}</b><span>redes</span></div></div></div>
    <div class="field cod-field"><label for="cod-text">Cód. Cliente *</label>
      <div class="cod-line"><input type="text" id="cod-text" class="cod-input" data-in="cod-text" inputmode="numeric" autocomplete="off" placeholder="${UI.paste && UI.paste.found.length ? 'Código do próximo cliente' : 'Ex.: 1035037'}" aria-describedby="cod-hint" value="${esc(UI.pasteText)}">
      <button class="btn primary" data-act="cod-run" id="cod-run-btn">+ Adicionar</button></div>
      <span class="hint" id="cod-hint">Enter também adiciona. Para vários de uma vez, separe por vírgula.</span></div>
    <div id="cod-results" aria-live="polite">${renderCodResults()}</div></div>
    <div class="card" id="selected-clients">${renderSelectedClients()}</div>`;
}
/** Lista de clientes digitados que ainda não receberam o nome da rede. */
function renderCodResults() {
  const p = UI.paste; if (!p) return '';
  const msgs = `${p.lastNotFound && p.lastNotFound.length ? `<div class="alert warn" role="alert">Não encontrado na base de clientes: <b>${p.lastNotFound.map(esc).join(', ')}</b>. Confira o código e digite de novo.</div>` : ''}${p.lastInfo ? `<div class="alert info">${esc(p.lastInfo)}</div>` : ''}`;
  if (!p.found.length) return msgs;
  const redeOf = (c) => (p.rede && p.rede[c.key] != null ? p.rede[c.key] : redeSugerida(c));
  const grupos = new Set(p.found.map((c) => keyOf(redeOf(c)))).size; const kaShown = new Set();
  return `${msgs}<div class="stage-box"><div class="stage-head"><b>Clientes a adicionar (${p.found.length})</b><span class="muted small">Confira a rede de cada um; dá para corrigir antes de adicionar.</span></div>
    <ul class="stage-list">${p.found.map((c) => { const ka = isKeyAccount(c); const rv = redeOf(c); const auto = rv === redeSugerida(c);
      const kk = ka ? kaKey(c) : ''; const first = ka && !kaShown.has(kk); if (first) kaShown.add(kk); const rest = first ? kaRestantes(c) : [];
      return `<li><span class="mono">${esc(c.codigo)}</span><span class="stage-name"><span>${esc(clientName(c))}<span class="muted small"> · ${esc(fmtCNPJ(c.cnpj))} · ${esc(c.segmento || '—')}</span></span>
        <span class="stage-meta small"><span><b>Supervisor:</b> ${esc(c.supervisor || '—')}</span><span><b>Gerência:</b> ${esc(c.gerencia || '—')}</span>${ka ? `<span><b>Key Account:</b> ${c.kaCodigo ? `${esc(String(c.kaCodigo).trim())} · ` : ''}${esc(c.keyAccount)} (${plural((IDX.byKa.get(kk) || []).length, 'loja')})${kaNomeRepetido(c) ? ' <span class="chip aviso" title="Outro Key Account tem o mesmo nome; a rede leva o número para não misturar">nome repetido</span>' : ''}</span>` : ''}</span>
        ${rest.length ? `<button class="btn sm ka-add" data-act="stage-add-ka" data-key="${esc(c.key)}">+ Adicionar ${rest.length === 1 ? 'a outra loja' : `as outras ${rest.length} lojas`} de ${esc(redeSugerida(c))}</button>` : ''}</span>

      <button class="btn primary" data-act="paste-add">Adicionar ${plural(p.found.length, 'cliente')}${grupos > 1 && !normSpaces(UI.addRede) ? ` (${grupos} redes)` : ''}</button></div></div>`;

INPUTS['cod-text'] = (el) => { UI.pasteText = el.value; };
INPUTS['add-rede'] = (el) => { UI.addRede = el.value; const b = $('[data-act="paste-add"]'); if (b && UI.paste) b.textContent = `Adicionar ${plural(UI.paste.found.length, 'cliente')}`; };
INPUTS['stage-rede'] = (el) => { const p = UI.paste; if (!p) return; (p.rede = p.rede || {})[el.dataset.key] = el.value; };
CHANGES['add-perfil'] = (el) => { UI.addPerfil = el.value; };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'cod-text') { e.preventDefault(); ACTIONS['cod-run'](); }
  if (e.key === 'Enter' && (e.target.id === 'add-rede' || (e.target.classList && e.target.classList.contains('stage-rede-in')))) { e.preventDefault(); ACTIONS['paste-add'](); }
});
function lookupTokens(tokens) {
  const seen = new Set(); const out = { found: [], notFound: [], repeated: [] };
  for (const raw of tokens) {
    const t = normSpaces(raw); if (!t) continue; const norm = keyOf(t);
    if (seen.has(norm)) { out.repeated.push(t); continue; } seen.add(norm);
    const m = IDX.byCodigo.get(norm);
    if (!m || !m.length) out.notFound.push(t); else out.found.push(m[0]);
  }
  return out;
}
const splitTokens = (s) => String(s).split(/[\n\r,;\t ]+/).map((x) => x.trim()).filter(Boolean);
/** Adiciona os códigos digitados à lista de espera (sem rede ainda). */
ACTIONS['cod-run'] = () => {
  const el = $('#cod-text'); UI.pasteText = el.value; const toks = splitTokens(UI.pasteText);
  if (!toks.length) { toast('Digite um Cód. Cliente.', 'warn'); el.focus(); return; }
  const r = lookupTokens(toks); const p = UI.paste || (UI.paste = { found: [], notFound: [], repeated: [] });
  const inStage = new Set(p.found.map((c) => c.key)); const inDraft = new Map(S.draft.clients.map((c) => [c.key, c.rede]));
  const added = [], dup = [], already = [];
  for (const c of r.found) { if (inStage.has(c.key)) dup.push(c.codigo); else if (inDraft.has(c.key)) already.push(`${c.codigo} (${inDraft.get(c.key)})`); else { p.found.push(c); inStage.add(c.key); added.push(c); } }
  p.notFound = r.notFound; p.repeated = r.repeated.concat(dup); p.lastNotFound = r.notFound;
  p.lastInfo = [already.length ? `Já está na solicitação: ${already.join(', ')}.` : '', dup.length || r.repeated.length ? `Já estava na lista: ${p.repeated.join(', ')}.` : ''].filter(Boolean).join(' ');
  UI.pasteText = r.notFound.join(', '); // mantém só o que não foi achado, para corrigir
  $('#cod-results').innerHTML = renderCodResults();
  const inp = $('#cod-text'); inp.value = UI.pasteText; inp.placeholder = 'Código do próximo cliente'; inp.focus(); if (UI.pasteText) inp.select();
  if (added.length) toast(added.length === 1 ? `${added[0].codigo} · ${clientName(added[0])} na lista` : `${added.length} clientes na lista`, 'ok');
};
ACTIONS['stage-add-ka'] = async (el) => {
  const p = UI.paste; if (!p) return; const c = p.found.find((x) => x.key === el.dataset.key); if (!c) return;
  const rest = kaRestantes(c); if (!rest.length) return;
  if (rest.length > 20 && !(await confirmBox('Adicionar lojas da rede', `<p>Adicionar mais <b>${rest.length} lojas</b> de <b>${esc(c.keyAccount)}</b> à lista?</p><p class="small muted">Depois dá para remover as que não entram na promoção.</p>`, 'Adicionar'))) return;
  const ja = S.draft.clients.filter((x) => x.snap && isKeyAccount(x.snap) && kaKey(x.snap) === kaKey(c)).length;
  p.found.push(...rest); p.lastNotFound = []; p.lastInfo = ja ? `${plural(ja, 'loja')} de ${c.keyAccount} já estava${ja > 1 ? 'm' : ''} na solicitação.` : '';

  const p = UI.paste; if (!p) return; p.found = p.found.filter((c) => c.key !== el.dataset.key); p.lastNotFound = []; p.lastInfo = '';
  if (!p.found.length) UI.paste = null;

/** Adiciona clientes. Rede: opts.rede (todos) > UI.addRede (todos) > rede de cada um (opts.redes[key]) > automática. */
function addClients(recs, opts = {}) {
  const todos = normSpaces(opts.rede != null ? opts.rede : UI.addRede || ''); const perfil = 'Ambos'; const por = opts.redes || {};
  const redeDe = (r) => todos || normSpaces(por[r.key] != null ? por[r.key] : redeSugerida(r));
  const sem = recs.filter((r) => r && !redeDe(r));
  if (sem.length) { toast(`Informe a rede de: ${sem.map((r) => r.codigo).join(', ')}.`, 'warn'); const f = $('#sr-' + cssId(sem[0].key)); if (f) f.focus(); return null; }
  let n = 0; const have = new Set(S.draft.clients.map((c) => c.key)); const redes = new Set();
  for (const r of recs) if (r && !have.has(r.key)) { const rede = redeDe(r); S.draft.clients.push({ key: r.key, snap: clone(r), perfilManual: perfil, rede }); have.add(r.key); redes.add(keyOf(rede)); n++; }
  if (n) touchDraft(); addClients.redes = redes.size; return n;
}
ACTIONS['paste-add'] = () => {
  if (!UI.paste || !UI.paste.found.length) { toast('Adicione pelo menos um cliente.', 'warn'); return; }
  document.querySelectorAll('.stage-rede-in').forEach((el) => { (UI.paste.rede = UI.paste.rede || {})[el.dataset.key] = el.value; });
  const n = addClients(UI.paste.found, { redes: UI.paste.rede || {} }); if (n == null) return;
  toast(`${plural(n, 'cliente adicionado', 'clientes adicionados')}${addClients.redes > 1 ? ` em ${addClients.redes} redes` : ''}`, 'ok');
  UI.paste = null; UI.pasteText = ''; UI.addRede = ''; renderFill(); const f = $('#cod-text'); if (f) f.focus();
};

/* ---- clientes selecionados ---- */
function renderSelectedClients() {
  const s = st(); if (!s.cvs.length) return `<h2>Clientes selecionados</h2><p class="empty">Nenhum cliente selecionado.</p>`;
  const byRede = new Map(); for (const cv of s.cvs) { const k = cv.rec.redeKey; if (!byRede.has(k)) byRede.set(k, []); byRede.get(k).push(cv); }

    rows.push(`<tr class="group-row"><td colspan="10">${esc(list[0].rec.rede || 'Sem rede informada')} — ${plural(list.length, 'cliente')} <button class="btn sm danger" style="margin-left:8px" data-act="cli-remove-rede" data-rede="${esc(k)}">Remover rede</button></td></tr>`);
    for (const cv of list) {
      const c = cv.rec; const errs = cv.errs.filter((e) => !(e === 'Cliente sem produto associado' && S.draft.step < 3)); const lvl = levelOf(errs, cv.warns);

      rows.push(`<tr id="cli-row-${cssId(cv.key)}" class="${lvl === 'erro' ? 'row-err' : lvl === 'aviso' ? 'row-warn' : ''}"><td class="mono">${esc(c.codigo)}</td><td>${esc(clientName(c))}${isKeyAccount(c) ? `<br><span class="small muted">Key Account: ${c.kaCodigo ? esc(String(c.kaCodigo).trim()) + ' · ' : ''}${esc(c.keyAccount)}</span>` : ''}</td><td class="mono">${esc(fmtCNPJ(c.cnpj))}</td><td>${esc(c.segmento || '—')}<br><span class="small muted">Tipo: ${esc(c.tipo)}</span></td><td>${esc(c.supervisor || '—')}<br><span class="small muted">${esc(c.gerencia || '')}</span></td>
        <td><input type="text" list="redes-usadas" data-ch="cli-rede" data-key="${esc(cv.key)}" value="${esc(d.rede || '')}" aria-label="Rede (BASE) de ${esc(clientName(c))}" style="min-width:150px"></td>

        <td>${statusChip(lvl)}${errs.concat(cv.warns).map((m) => `<div class="msg ${errs.includes(m) ? 'err' : 'warn'}">${esc(m)}</div>`).join('')}</td>
        <td><div class="btn-row">${cv.changed ? `<button class="btn sm" data-act="cli-refresh" data-key="${esc(cv.key)}">Ver alterações</button>` : ''}<button class="btn sm danger" data-act="cli-remove" data-key="${esc(cv.key)}" aria-label="Remover ${esc(clientName(c))}">Remover</button></div></td></tr>`);

}

/* =============== ETAPA 2 — PRODUTOS =============== */
function compatClients(p) { return st().cvs.filter((cv) => p.tipo && perfilAceita(cv.perfil, p.tipo)); }
/* Filtros encadeados: as opções de cada filtro consideram os demais filtros ativos (ex.: marca COCA-COLA mostra só as embalagens da Coca-Cola). */
const PF_FIELDS = ['marca', 'conteudo', 'tipo', 'categoria'];
/** Tamanho do produto a partir do conteúdo (ml): 350 ml, 1 L, 1,5 L, 2.838 ml. */
function fmtTamanho(v) { const n = Number(v); if (!isFinite(n) || n <= 0) return String(v); return n >= 1000 && n % 100 === 0 ? `${String(n / 1000).replace('.', ',')} L` : `${n.toLocaleString('pt-BR')} ml`; }
function pfValue(p, k) { return k === 'tipo' ? p.tipo : k === 'conteudo' ? (p.conteudo === '' || p.conteudo == null ? '' : String(Number(p.conteudo))) : keyOf(p[k]); }
function pfMatch(p, except) {
  const f = UI.pf; const q = keyOf(f.q); const qd = onlyDigits(f.q);
  for (const k of PF_FIELDS) if (k !== except && f[k] && pfValue(p, k) !== f[k]) return false;
  return !q || keyOf(p.descricao).includes(q) || (qd && p.ean.includes(qd)) || (p.codigo && keyOf(p.codigo).includes(q));
}
function filteredCatalog() { return S.bases.produtos.records.filter((p) => pfMatch(p)); }
function facetOptions(field) {
  const m = new Map();
  for (const p of S.bases.produtos.records) if (pfMatch(p, field)) { const k = pfValue(p, field); if (k) { const e = m.get(k); m.set(k, { label: field === 'conteudo' ? fmtTamanho(k) : normSpaces(p[field]), n: (e ? e.n : 0) + 1 }); } }
  return Array.from(m.entries()).sort((a, b) => (field === 'conteudo' ? Number(a[0]) - Number(b[0]) : a[1].label.localeCompare(b[1].label, 'pt-BR')));
}
function renderFilterBar() {
  let changed = true; // remove seleções que deixaram de existir com os outros filtros
  while (changed) { changed = false; for (const k of PF_FIELDS) if (UI.pf[k] && !facetOptions(k).some(([v]) => v === UI.pf[k])) { UI.pf[k] = ''; changed = true; } }
  const sel = (field, label, all) => `<div class="field" style="min-width:170px;flex:1"><label for="pf-${field}">${label}</label><select id="pf-${field}" data-ch="pf" data-f="${field}"><option value="">${all}</option>${facetOptions(field).map(([k, o]) => `<option value="${esc(k)}" ${UI.pf[field] === k ? 'selected' : ''}>${esc(o.label)} (${o.n})</option>`).join('')}</select></div>`;
  return `${sel('categoria', 'Categoria', 'Todas')}${sel('marca', 'Marca', 'Todas')}${sel('tipo', 'Unitário/Caixa', 'Todos')}${sel('conteudo', 'Tamanho do produto', 'Todos')}`;
}
function renderStep2() {

      <button class="btn ghost" data-act="pf-clear">Limpar filtros</button></div>

function renderCatalog() {

  return `<div class="btn-row" style="margin-bottom:8px"><span class="muted">${list.length} produto(s) ${list.length > shown.length ? `(exibindo ${shown.length}; refine os filtros)` : ''}</span></div>
    <div class="table-wrap tall"><table class="t catalog"><thead><tr><th><button class="add-all" data-act="prod-add-all" ${addable.length ? '' : 'disabled'} title="Adicionar todos os produtos da lista que ainda não foram adicionados"><span class="sq-plus" aria-hidden="true">+</span> Adicionar todos${addable.length ? ` (${addable.length})` : ''}</button></th><th>EAN/DUM</th><th>Descrição</th><th>Marca</th><th>Embalagem</th><th>Categoria</th><th>Tipo</th><th>Família</th></tr></thead><tbody>
    ${shown.map((p) => { const cc = compatClients(p); const dis = !p.tipo || !cc.length; const n = S.draft.items.filter((i) => i.productKey === p.key).length; const k = esc(p.key); const d = esc(p.descricao);

function renderStep4() {

  const issueRow = (i, idx) => `<li class="${i.level === 'erro' ? 'msg err' : 'msg warn'}" style="font-size:13px;margin:4px 0"><b>${esc(i.where)}</b>: ${esc(i.msg)} <button class="btn sm ghost" data-act="goto-issue" data-i="${idx}">Corrigir →</button></li>`;
  const uniq = (arr) => { const seen = new Set(); return arr.filter((i) => { const k = i.level + i.where + i.msg; if (seen.has(k)) return false; seen.add(k); return true; }); };
  const errs = uniq(s.errors), warns = uniq(s.warnings); window.__issues = errs.concat(warns);
  return `<div class="card"><div class="card-head"><div><h1>4. Revisar a solicitação</h1><p class="muted">Confira por cliente e produto. A exportação do Excel final é feita pela Administração.</p></div>${statusChip(lvl, lvl === 'ok' ? 'Válido' : lvl === 'aviso' ? 'Com aviso' : 'Com erro')}</div>
    <div class="stats"><div class="stat"><b>${s.cvs.length}</b><span>clientes</span></div><div class="stat"><b>${redes.size}</b><span>redes</span></div><div class="stat"><b>${s.ivs.length}</b><span>produtos</span></div><div class="stat"><b>${s.lines.length}</b><span>vínculos cliente×produto</span></div><div class="stat"><b style="color:var(--err)">${errs.length}</b><span>erros</span></div><div class="stat"><b style="color:var(--warn)">${warns.length}</b><span>avisos</span></div></div>
    <div class="grid2"><div class="field"><label for="meta-sol">Solicitante</label><input type="text" id="meta-sol" data-in="meta" data-f="solicitante" value="${esc(S.draft.meta.solicitante)}"></div><div class="field"><label for="meta-obs">Observações</label><input type="text" id="meta-obs" data-in="meta" data-f="observacoes" value="${esc(S.draft.meta.observacoes)}"></div></div>
    <div class="btn-row" style="margin-top:12px">${S.draft.meta.revisaoAdmin ? '<button class="btn primary" data-act="admin-save">Salvar edição</button><button class="btn" data-act="goto-export">Exportar Excel da solicitação</button>' : ''}<button class="btn" data-act="export-request">Exportar solicitação (JSON)</button>${SH.publico ? '' : '<button class="btn" data-act="view" data-view="tickets">Minhas solicitações</button>'}<button class="btn danger" data-act="new-draft">Nova solicitação</button></div>
    ${errs.length ? `<div class="alert err" style="margin-top:12px"><b>${errs.length} erro(s)${errs.some((e) => e.inv) ? ` — ${errs.filter((e) => e.inv).length} de investimento, que a Administração pode resolver ao receber a solicitação` : ''}:</b><ul style="list-style:none;margin-left:0">${errs.map((i, k) => issueRow(i, k)).join('')}</ul></div>` : '<div class="alert ok" style="margin-top:12px">Nenhum erro bloqueante.</div>'}
    ${warns.length ? `<details class="box" ${errs.length ? '' : 'open'}><summary>${warns.length} aviso(s)</summary><div><ul style="list-style:none;margin:0;padding:0">${warns.map((i, k) => issueRow(i, errs.length + k)).join('')}</ul></div></details>` : ''}
  </div>
  <div class="card"><h2>Detalhamento por rede, cliente e produto</h2>${renderReviewTable(s)}</div>
  ${S.draft.meta.revisaoAdmin ? '' : (() => { const blk = errs.filter((e) => !e.inv).length; const re = S.draft.meta.chamado && S.draft.meta.chamado.id;
    return `<div class="send-box${blk ? ' blocked' : ''}"><div class="send-txt"><b>${blk ? 'Corrija os erros acima para enviar' : 'Tudo pronto? Envie para a Administração'}</b><span>${blk ? `${plural(blk, 'erro bloqueia', 'erros bloqueiam')} o envio. Use os botões "Corrigir →" na lista de erros.` : `${plural(s.cvs.length, 'cliente')} · ${plural(redes.size, 'rede')} · ${plural(s.ivs.length, 'produto')}. A solicitação entra na fila de atendimento.`}</span></div>
      <button class="btn send send-big" data-act="send-ticket" ${blk ? 'disabled title="Corrija os erros para enviar"' : ''}>${re ? 'Reenviar a promoção' : 'Enviar a promoção'} →</button></div>`; })()}`;
}
function renderReviewTable(s) {

    for (const cv of g.clients) for (const l of g.lines.length ? s.lines.filter((x) => x.cv === cv) : []) {
      const lv = lineStatus(l); const inv = l.inv || {};
      rows.push(`<tr class="${lv === 'erro' ? 'row-err' : lv === 'aviso' ? 'row-warn' : ''}"><td>${esc(cv.rec.codigo || '—')}<br><span class="small muted">${esc(clientName(cv.rec))}</span></td><td>${esc(l.product.descricao)}<br><span class="small mono muted">${esc(l.product.ean)}</span></td><td>${esc(l.product.tipo)}</td>
        <td class="num">${l.ttcCents ? fmtBRL(l.ttcCents) : '—'}</td><td>${l.exc ? 'Exceção administrativa' : esc(inv.label || INV_STATUS_LABEL[l.invStatus] || '—')}<br><span class="small muted">${l.exc ? esc(l.exc.responsavel) : inv.rule ? 'Regra ' + esc(ruleName(inv.rule)) : ''}</span></td>
        <td class="num">${l.reembolsoCents != null ? fmtBRL(l.reembolsoCents) : '—'}</td><td class="num">${l.ratio != null ? `<span class="band-dot ${l.band}"></span>${fmtPct(l.ratio)}` : '—'}</td><td class="num">${l.budgetCents != null ? fmtBRL(l.budgetCents) : '—'}</td><td class="num">${l.limite != null ? l.limite : '—'}</td>
        <td>${fmtDate(l.item.inicio)}</td><td>${fmtDate(l.item.fim)}</td><td class="num">${l.iv.dias || '—'}</td><td>${statusChip(lv)}${[...new Set(l.errs)].map((m) => `<div class="msg err">${esc(m)}</div>`).join('')}${[...new Set(l.warns)].map((m) => `<div class="msg warn">${esc(m)}</div>`).join('')}</td>

}

/** Impacto da atualização no rascunho atual. */
function draftImpact(type, diff, finalRecs) {
  const items = [];
  if (type === 'clientes') {
    const ch = new Map(diff.alterados.map((d) => [d.key, d])); const rm = new Set(diff.removidos.map((r) => r.key));
    for (const c of S.draft.clients) {
      if (ch.has(c.key)) items.push({ what: `Cliente ${clientLabel(c.snap)}`, change: 'alterado: ' + ch.get(c.key).fields.map((f) => `${fieldLabel('clientes', f)} "${ch.get(c.key).old[f] ?? ''}" → "${ch.get(c.key).rec[f] ?? ''}"`).join('; ') });
      if (rm.has(c.key)) items.push({ what: `Cliente ${clientLabel(c.snap)}`, change: 'removido da base' });
    }
  } else if (type === 'produtos') {
    const ch = new Map(diff.alterados.map((d) => [d.key, d])); const rm = new Set(diff.removidos.map((r) => r.key));
    for (const it of S.draft.items) {
      if (ch.has(it.productKey)) items.push({ what: `Produto ${it.snap.descricao}`, change: 'alterado: ' + ch.get(it.productKey).fields.map((f) => `${fieldLabel('produtos', f)} "${ch.get(it.productKey).old[f] ?? ''}" → "${ch.get(it.productKey).rec[f] ?? ''}"`).join('; ') });
      if (rm.has(it.productKey)) items.push({ what: `Produto ${it.snap.descricao}`, change: 'removido da base' });
    }
  } else {
    const snap = () => { const m = new Map(); for (const l of compute().lines) if (l.cv) m.set(l.key, `${INV_STATUS_LABEL[l.inv ? l.inv.status : '']}${l.reembolsoCents != null ? ' · ' + fmtBRL(l.reembolsoCents) : ''}${l.inv && l.inv.rule ? ' · regra ' + ruleName(l.inv.rule) : ''}`); return m; };
    const before = snap(); const keep = IDX.invest; IDX.invest = mergeBase(S.bases.investimentos.records, finalRecs, IMP.mode);
    const after = snap(); IDX.invest = keep;
    for (const [k, v] of before) if (after.get(k) !== v) { const l = st().lines.find((x) => x.key === k); items.push({ what: `${l.product.descricao} → ${clientLabel(l.cv.rec)}`, change: `${v} ⇒ ${after.get(k)}` }); }
    if (Object.keys(S.draft.exceptions).length) items.push({ what: 'Exceções administrativas', change: 'Toda atualização da base de investimentos exige nova revisão das exceções existentes' });
  }
  return items;
}

  <hr><h3>Forma de aplicação</h3>

  m.ultimoRelatorio = { data: m.dataAtualizacao, total: a.total, invalid: a.invalid.slice(0, 500), duplicates: a.duplicates.slice(0, 500), conflicts: a.conflicts.slice(0, 300).map((c) => ({ key: c.key, label: c.label, fields: c.fields, rows: c.candidates.map((r) => r._row), resolucao: IMP.resolutions[c.key] === 'excluir' ? 'não importado' : 'linha ' + c.candidates[Number(IMP.resolutions[c.key])]._row })), normalizations: a.normalizations.slice(0, 500), warnings: a.warnings.slice(0, 500) };

function demoCNPJ(root8, branch) {
  const base = String(root8).padStart(8, '0') + String(branch).padStart(4, '0');
  const dv = (s) => { const w = s.length === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]; let t = 0; for (let i = 0; i < s.length; i++) t += Number(s[i]) * w[i]; const r = t % 11; return r < 2 ? 0 : 11 - r; };
  const d1 = dv(base); const d2 = dv(base + d1); return base + d1 + d2;
}
function demoCPF(n9) { const b = String(n9).padStart(9, '0'); const dv = (s) => { let t = 0; for (let i = 0; i < s.length; i++) t += Number(s[i]) * (s.length + 1 - i); return (t * 10) % 11 % 10; }; const d1 = dv(b); return b + d1 + dv(b + d1); }
function demoRows(matrix) { return matrix.map((r) => r.map((v) => (v === '' || v == null ? null : typeof v === 'number' ? { t: 'n', v, text: numberText(v), numeric: true } : { t: 's', v, text: v }))); }

/* ===================== Reembolso por produto (tabela de investimentos liberados) =====================
   Cada produto (EAN) aponta para uma linha da tabela (Nº). Ao adicionar o produto, o reembolso é preenchido sozinho.
   Padrão: REEMB_PADRAO (src/07_reembolso.js). A Administração pode substituir importando a planilha. */

function reembIndex() {
  const t = reembTabela(); if (REEMB_IDX.tab === t) return REEMB_IDX.map;

    const g = typeof v === 'object' ? v : grupos.get(String(v)); if (!g || !(Number(g.reembolso) > 0)) continue;
    map.set(gtinKey(ean), g);

ACTIONS['pv-file'] = (el) => { PV.fi = Number(el.dataset.i); renderPreviewTabs(); renderPreviewTable(); };
